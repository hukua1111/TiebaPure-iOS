name: Package unsigned IPA

# Builds an unsigned .ipa from the current branch and uploads it as a build
# artifact. Unsigned builds cannot be installed as-is: re-sign them with your
# own certificate before sideloading.
on:
  # Pushing the integration branch packages an IPA automatically, so a fork can
  # produce a build without any manual dispatch. Any other branch has to ask.
  push:
    branches:
      - ios15-support
  workflow_dispatch:

permissions:
  # Needed to attach the IPA to a release, which is the only download channel
  # that does not require a GitHub session.
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install XcodeGen
        run: brew install xcodegen

      # Regenerate the project from project.yml first. The packaging script
      # refuses to package when the committed project differs from the spec, and
      # regenerating in place keeps both sides of that comparison identical while
      # also validating that the spec itself still builds a project.
      - name: Regenerate project from project.yml
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          mkdir -p build
          if scripts/package-unsigned-ipa.sh 2>&1 | tee build/package.log; then
            test -f build/TiebaPure-unsigned.ipa
            ls -lh build/TiebaPure-unsigned.ipa
            shasum -a 256 build/TiebaPure-unsigned.ipa
            printf 'IPA_PATH=build/TiebaPure-unsigned.ipa\n' >> "$GITHUB_ENV"
          else
            # Surface the failure in the job summary so the compiler diagnostics
            # stay readable even where the raw step log is not accessible.
            {
              echo '### 打包失败：日志尾部'
              echo '```'
              tail -n 200 build/package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # The step log needs authentication to read, check-run annotations do
            # not, so mirror the tail plus the first compiler errors there.
            tail -n 12 build/package.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > build/annotation-tail.txt
            echo "::error::$(cut -c1-8000 < build/annotation-tail.txt)"
            grep -E "error: " build/package.log | head -n 6 | sed 's/%/%25/g' | cut -c1-900 |
              while IFS= read -r line; do
                echo "::error::$line"
              done || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TiebaPure-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios15-preview"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$IPA_PATH" --clobber
          else
            gh release create "$tag" "$IPA_PATH" \
              --title "iOS 15 预览构建" \
              --notes "由 $(git rev-parse --short HEAD) 构建的未签名 IPA（iOS 15.0+），安装前需自行重签。" \
              --prerelease
          fi
